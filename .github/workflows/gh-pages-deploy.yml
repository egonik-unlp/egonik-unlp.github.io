name: Release to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  github-pages-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-leptos
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos

      - name: Check formatting
        run: cargo fmt --check

      - name: Build site
        run: cargo leptos build --release

      # GitHub Pages cannot run the Axum SSR process. Render the only route once
      # during CI, then publish that HTML together with the hydration bundle and
      # static assets produced by cargo-leptos.
      - name: Render static homepage
        env:
          LEPTOS_SITE_ADDR: 127.0.0.1:3000
          LEPTOS_SITE_ROOT: target/site
        run: |
          ./target/release/website &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ --output target/site/index.html; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
