name: Release to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-leptos
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos

      - name: Install Dart Sass
        run: |
          npm install --no-save --no-package-lock sass@1.102.0
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --check

      - name: Build site
        run: cargo leptos build --release

      # GitHub Pages cannot run the Axum SSR process. Render each public route
      # during CI, then publish that HTML together with the hydration bundle and
      # static assets produced by cargo-leptos.
      - name: Render static routes
        env:
          LEPTOS_SITE_ADDR: 127.0.0.1:3000
          LEPTOS_SITE_ROOT: target/site
        run: |
          ./target/release/website &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ --output target/site/index.html; then
              break
            fi
            sleep 1
          done
          test -s target/site/index.html
          mkdir -p target/site/es
          curl --fail --silent --show-error http://127.0.0.1:3000/es --output target/site/es/index.html
          test -s target/site/es/index.html

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
