[package]
name = "gv-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
either = "1.15.0"
futures = "0.3.31"
gloo = "0.11.0"
gloo-net = "0.6.0"
leptos = { version = "0.8.5", features = ["csr"] }
leptos_router = "0.8.5"
log = "0.4.27"
reactive_stores = "0.2.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3", features = [
  "File",
  "Blob",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "ImageBitmap",
  "Url",
  "Request",
  "FormData",
] }
[lints.clippy]
needless_return = "allow"
uninlined_format_args = "allow"
dead_code = "allow"
unused_imports = "allow"
